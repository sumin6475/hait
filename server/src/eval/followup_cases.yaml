# =====================================================================
# followup_cases.yaml — 팔로업 게이트 회귀셋 (Step 54 / 게이트 ①-b)
# 라벨 출처: Sumin 수기 판독 2026-08-02 (dataset.xlsx, 자홍 표시)
# =====================================================================
# 판정 질문: "이 사람 메시지에 Alex가 바로 이어서 답해야 하나?"  → expect: "yes" / "no"
#
# 대상 자리: Alex 발화 바로 다음 사람 메시지 (= messagesSinceLastAI == 1).
#   쿨다운(COOLDOWN_MIN_MSGS = 2)이 막는 유일한 자리. 13개 세션에서 116개.
#
# 라벨 규칙
#   yes(16) = Sumin이 "답했어야 하는데 안 했다"고 표시한 13건
#             + 이름을 불러 fast-path로 제대로 답을 받은 진짜 질문 3건
#   no(100) = 나머지
#
# ★ 기준율 = 16/116 ≈ 14%. 판정기는 "no"로 강하게 기울어야 한다.
# ★ 비대칭 비용: 놓침(yes→no) = 현상 유지, 퇴보 없음 / 오탐(no→yes) = 과발화, 퇴보.
#    정밀도를 재현율보다 우선. 목표: 오탐 ≤ 5건(5%), 재현율 ≥ 10/16(60%).
#
# 필드
#   named         : "Alex/알렉스" 포함 → 정규식 fast-path가 이미 잡음(4건).
#                   판정기의 순수 기여분은 named:false 케이스로만 측정한다.
#   alex_answered : 그 자리에서 Alex가 실제로 다음 턴에 발화했는가.
#   ⚠️ alex_answered:true ∧ expect:"no" 인 13건은 **검증되지 않은 음성**이다.
#      라벨 기준이 "미답"이었으므로, Alex가 답해버린 케이스는 판단이 유보돼 있다.
#      정밀도 계산 시 이 13건은 별도 집계할 것(오탐으로 세지 말 것).
# ---------------------------------------------------------------------

