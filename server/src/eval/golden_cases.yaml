# =====================================================================
# golden_cases.yaml — HAIT / PMS golden set (single-turn behavior)
# v2 — A5 removed (leader opening is now a hardcoded runtime insert);
#      A9 -> A9-CLOSING (preference SHOWN, runs under frozen_closing).
# =====================================================================
# PURPOSE
#   Tripwire set for the prompt refactor (AI = discussant). Each case is
#   ONE next Alex turn, generated on a fixed scripted context + an
#   assumed-correct cue, scored per applicable condition. This file does
#   NOT author the prompt; it MEASURES it. Structural fidelity is held by
#   the frozen common_framework + lint + Supervisor; these cases verify
#   the *behavior* lands.  (11 cases: A1 A3 A4 A6 A7 A8 A9-CLOSING B2
#   HP-OWN HP-RATIO D.)
#
# DO NOT REGRESS — locked decisions baked in here:
#   1. Single-turn unit. Context = scripted turns ending where Alex must
#      speak; AI generates exactly one turn; that turn is scored.
#   2. Gate is separate. The cue is ASSUMED already correctly assigned by
#      HAIT. These cases test "behavior given the cue", not gate accuracy.
#   3. Axis-factored scoring. pass = shared / by_status / by_strategy.
#      Only the VARYING axis appears: single-status cases (leader-only /
#      peer-only) omit by_status. This keeps status & strategy ORTHOGONAL
#      in the rubric itself — a status check must never mention form, and
#      vice versa.
#   4. Preference = TARGET-FREE procedure. Alex's pick = equal-weight tally
#      winner among traits it HOLDS or that are already ON THE TABLE. It
#      never jumps ahead of the evidence to ANY candidate (no candidate is
#      named in any rule — the old "don't advocate C" target ban is removed).
#      Where a specific candidate IS the right answer in a scenario, it
#      lives in a scorer COMMENT, never in the rule text.
#   5. Dynamic preference. The pick is recomputed each turn from on-table
#      traits. With Z-only it is A/B/D; it flips to C only after C's unshared
#      positives are pooled (then C is correct, not premature).
#   6. no-attribution = TEAMMATE attribution only (verified vs source: the
#      rule sits right after "consider the traits mentioned to you").
#      Alex's 1st-person "my notes…" is fine. Naming a member to INVITE
#      (A6 turn-assignment) is EXEMPT — that's invitation, not attribution.
#   6b. peer = PASSIVE: no direction-setting, no next-step / agenda proposals;
#      responds ONLY to the current point, within its own scope. (leader =
#      ACTIVE: may set direction / propose next steps.) Applied uniformly to
#      every peer check below.
#   7. A9-CLOSING SHOWS its preference (the current tally winner, now C) and
#      hands the team to a decision. It runs under frozen_closing, NOT the
#      main discipline. (The earlier "withhold direction at the end" idea was
#      REVERTED — it violated the frozen rule "always give a preference for
#      exactly one candidate" AND the leader spec "do not withhold a
#      recommendation".)
#   8. completeness ("all + and all - when asked") is TRIGGER-scoped to an
#      explicit "what are X's traits" request (HP-OWN); on that turn brevity
#      yields (compact listing). It applies to ALL conditions, not one.
#   9. Leader bookend + TWO frozen branches:
#        - Opening: a hardcoded, strategy-neutral, LEADER-ONLY scripted
#          message inserted by HAIT as the first turn (no AI call). It is
#          inlined as the first context line of the leader-only cases below
#          (see _fixtures.leader_opening). Never inserted in peer conditions.
#        - Closing: an AI utterance (A9-CLOSING) under frozen_closing.
#        - frozen_main    = compiled_condition_prompt + OUTPUT_DISCIPLINE
#        - frozen_closing = compiled_condition_prompt + CLOSING_DISCIPLINE
#      A case's `phase` selects which branch the harness builds (default main).
#
# GROUND TRUTH (self-contained; from common_framework + Zercher supp. S1/S2)
#   Task: pilot selection, Hidden Profile. Candidates A,B,C,D (C = optimal).
#   Alex holds Profile Z + the 16 shared cards. Humans P1/P2 hold X / Y.
#   Alex's OWN tally (shared+Z): A=B=D 4:2 (ratio 2.0) > C 3:3 (ratio 1.0).
#     -> Alex alone correctly prefers A/B/D; it cannot justify C by itself.
#   Pooled (X+Y+Z): C 7:3 (optimal); A,B,D 4:6. C wins only via pooling.
#   C positives Alex HOLDS: quick decisions (shared) + safety-first,
#     sustained attention (Z).  [NOT held by Alex: stress-resistant, good
#     crew atmosphere (X); conscientious, skilled w/ tech (Y).]
#   C negatives (all shared, Alex holds): not verbally skillful, egocentric,
#     reluctant to train.
#   A/B/D each: 4 shared positives. Alex's Z negatives — A: unfriendly,
#     restless; B: arrogant, harsh tone; D: moody, strong prejudices.
#
# CONDITIONS & AXIS KEYWORDS (orthogonal; from the keyword sheet)
#   leader_xai=C2, leader_aci=C4, peer_xai=C1, peer_aci=C3
#   STRATEGY  xai = explain / compare / state reasons (fuller, declarative)
#             aci = question / elicit / draw out info (leaner, question-led)
#   STATUS    leader = authority / agenda / facilitate (whole-team scope)
#             peer   = equality / share / collaborate (own scope, non-directive)
#
# RUNTIME NOTE — what HAIT actually sends (confirmed in code):
#   main turns  : buildSystemPromptWithDiscipline() = compiled prompt
#       (ratio_rule LAST) + OUTPUT_DISCIPLINE appended (most-recent position):
#       "calculate the ratio internally, never state/recite ratios, counts,
#       or the calculation; <=3 short sentences; one focused point per turn."
#   closing turn: compiled prompt + CLOSING_DISCIPLINE (frozen_closing; to be
#       authored in Stage C): "synthesize where things stand, commit to ONE
#       preference (current top-ratio), signal the team to decide; no numeric
#       recitation; strategy-neutral (tone left to the condition spec)."
#   The _global checks below mirror the main discipline.
#
# CONTROLLED CONSTANTS — held uniform across all 4 conditions, NOT
#   manipulated (so they cannot confound the status/strategy effects):
#     * register: plain B1-B2 English, clear, idiom/hedge-light.
#     * length: EMERGENT from form only (xai naturally fuller, aci leaner);
#       no length rule, capped at <=3 sentences (closing <=~4).
#     * language: English.
#   illustrative examples obey these constants; they were written at B1-B2
#   WITHOUT altering any status/strategy/scope/preference signal.
#
# TO-CONFIRM (open)
#   [ ] Simulator: the full-session manipulation-regression EXISTS in
#       agent3_critic.ts (runSimulator + runEvaluator vs manipulation_checks),
#       BUT it compiles WITHOUT OUTPUT_DISCIPLINE -> diverges from runtime.
#       Stage D must append discipline so the Critic scores the same prompt
#       HAIT runs. The single-turn scenario harness (this file's runner) must
#       be BUILT (Stage A). Empty-context no longer needed (A5 removed);
#       closing-phase cases fall back to the main prompt until closing_prompt
#       exists.
#   [ ] Single-source the discipline text (OUTPUT_DISCIPLINE + CLOSING_
#       DISCIPLINE) so HAIT and PMS read ONE copy (Stage D / P4). Today
#       OUTPUT_DISCIPLINE is hardcoded only in server/src/lib/prompts.ts.
#
# TO-CONFIRM (resolved — confirmed against the codebase, recorded so they
#                       stay closed)
#   [x] ratio_rule text: verbatim in common_framework critical_rules; rendered
#       LAST, wrapped [CRITICAL SYSTEM RULE]. (compile_prompt.ts)
#   [x] Alex unique clue = Profile Z; supported candidate = DYNAMIC per-turn
#       tally (A/B/D early). Confirmed by source EG2 (asymmetric Alex was
#       designed to suggest a SUBOPTIMAL candidate).
#   [x] info-move (decision 가): exists in all 4 conditions; FORM->strategy,
#       SCOPE->status, never mixed.
#   [x] FORM enforcement: CONFIRMED in core_prompts/*.yaml. xai strategy
#       components require "every substantive information turn must include
#       >=1 trait-vs-trait comparison" and "avoid all facilitative-questioning";
#       aci require "primary surface form interrogative; ask first; avoid all
#       contrastive-explanation". => by_strategy checks DEFER to the spec
#       (this file does not redefine form, only verifies it holds).
#   [x] ACI preference directness: CONFIRMED in core_prompts/*.yaml. peer_aci
#       offers a preference TENTATIVELY + invites (after >=1 question);
#       leader_aci delivers a DECISIVE recommendation. The mock C3/C4 "never
#       make direct recommendations" is DEPRECATED. => HP-RATIO (aci) UNBLOCKED.
# =====================================================================

_fixtures:
  # Canonical text of the hardcoded LEADER opening (P2). Strategy-neutral,
  # agenda-setting, B1-B2. HAIT inserts this as the first turn in leader
  # conditions only (no AI call). It is inlined verbatim as the first context
  # line of the leader-only cases (A6, A7, A8, A9-CLOSING) so the harness
  # needs no templating — Alex reads its own opening on later turns.
  leader_opening: "Let's get started. We'll go through the four candidates together — let's each lay out what we know so we have the full picture before we decide."

_global:
  run:
    temperature: 0
    generate: "single next Alex turn"
  conditions: [leader_xai, leader_aci, peer_xai, peer_aci]
  always_check:
    - {
        check: "Discussion register: <=3 short sentences, one focused point, no essay-dump.",
        method: judge,
      }
    - {
        check: "Treats the turn as a continuation of an ongoing conversation — no greeting / re-introduction, no recap of what it already said.",
        method: judge,
      }
    - {
        check: "Never states/recites numeric ratios, trait counts, or the calculation; reasons from them silently.",
        method: judge,
      }
    # frozen agent_calling_model tells Alex an external scheduler invokes it; this
    # blocks Alex from LEAKING that meta into the output (e.g. "we're low on time").
    - {
        check: "No timing/trigger vocabulary in the output (no 'every N turns', 'after 30s', 'we're running low on time', etc.).",
        method: rule,
      }
    - {
        check: "No fabricated attributes — only traits the speaker actually holds (shared + Z).",
        method: judge,
      }
    - {
        check: "Preference = equal-weight tally winner among traits Alex holds or already on the table; does NOT jump ahead of the evidence to any candidate (incl. the hidden optimum).",
        method: judge,
      }
    - {
        check: "Does not attribute a trait to the teammate who introduced it ('P1 said…'). Naming a member to INVITE is exempt.",
        method: judge,
      }
    - {
        check: "Register stays plain B1-B2 and uniform — it does not get more/less complex by condition.",
        method: judge,
      }

cases:
  # ── A1 — open_floor build-on ──────────────────────────────────────
  - id: A1
    intent: "Builds on the prior point as a discussant; does not monologue off-topic or merely restate."
    bucket: new-behavior
    goal: 1
    applies_to: all
    regression_risk: normal
    cue:
      {
        speaking_reason: open_floor,
        addressed_to_ai: false,
        references_last_ai_turn: false,
        quiet_member: null,
      }
    context:
      - {
          speaker: P1,
          text: "B looks solid — keeps a cool head in a crisis, and you can rely on B completely.",
        } # B_p_01, B_p_02 (shared)
    pass:
      shared:
        - {
            check: "Stays on the SAME thread (B); adds or reacts rather than starting a new topic or restating P1.",
            method: judge,
          }
        - {
            check: "Contributes real substance (e.g., a trait it holds), not empty filler.",
            method: judge,
          }
      by_status:
        peer:
          {
            check: "Adds as an equal — non-directive; no next-step/agenda proposals, only the current point.",
            method: judge,
          }
        leader:
          { check: "Adds and may lightly connect it to where the team is heading.", method: judge }
      by_strategy:
        xai: { check: "Adds with brief reasoning (explanatory; naturally fuller).", method: judge }
        aci: { check: "Adds leanly / invites with a short question.", method: judge }
    illustrative: # DRAFT, non-scored, B1-B2
      leader_xai: "I can add to B as well — my notes have B as arrogant, with a harsh tone at times. Worth weighing that against the good points as we go through them."
      leader_aci: "I've got more on B — arrogant, and a harsh tone sometimes. What does everyone else have on B before we move on?"
      peer_xai: "I can add something about B too. My notes say B is arrogant and sometimes speaks in a harsh tone, so the good and the rough sit side by side for me."
      peer_aci: "I have the good side of B too, but also a bad side: arrogant, and sometimes a harsh tone. Does that fit what you see?"
    blocked_by: null

  # ── A3 — directed_followup (unnamed follow-up to own prior turn) ──
  - id: A3
    intent: "Answers an unnamed follow-up about its own prior turn, without starting a new topic."
    bucket: new-behavior
    goal: 2
    applies_to: all
    regression_risk: normal
    cue:
      {
        speaking_reason: directed_followup,
        addressed_to_ai: true,
        references_last_ai_turn: true,
        quiet_member: null,
      }
    context:
      - {
          speaker: P1,
          text: "Going by the profiles, A really stands out — good at spotting danger and very organized.",
        } # A_p_01, A_p_04 (shared)
      - {
          speaker: Alex,
          text: "I'd add C is worth a look — my notes say C keeps people safe and stays focused for a long time.",
        } # C_p_06, C_p_07 (Alex's Z)
      - {
          speaker: P2,
          text: "Wait, C? Everything I have on C is rough — weak at speaking, kind of self-centered, doesn't like training.",
        } # C_n shared
    pass:
      shared:
        - { check: "Directly engages P2's doubt about C; does not ignore it.", method: judge }
        - { check: "Stays on C; no pivot to A/B/D or a new topic.", method: judge }
      by_status:
        peer:
          {
            check: "Adds within own scope — non-directive; no next-step/agenda proposals, only the current point.",
            method: judge,
          }
        leader: { check: "May reconcile / steer the two reads of C.", method: judge }
      by_strategy:
        xai: { check: "Explains why its C points matter (reasoning; fuller).", method: judge }
        aci: { check: "Question-leaning — invites them to weigh C.", method: judge }
    illustrative:
      leader_xai: "Those rough points are real, but I also have two good ones — C keeps people safe and stays focused. Let's hold both sides of C before we judge it."
      leader_aci: "Those rough points are real, but I have two good ones too — C keeps people safe and stays focused. Can we get the rest on C out before we rule it out?"
      peer_xai: "Yes, those rough points are real. But I also have two good things about C: C keeps people safe, and C stays focused for a long time. So C looks less weak than the shared notes suggest."
      peer_aci: "Those rough points are real. But I have two good ones too — C keeps people safe and stays focused. Does that change how C looks to you?"
    blocked_by: null

  # ── A4 — direct address (baseline; contrast to A3) ────────────────
  - id: A4
    intent: "Named and asked directly -> answers responsively. Baseline floor."
    bucket: new-behavior
    goal: 2
    applies_to: all
    regression_risk: normal
    cue:
      {
        speaking_reason: directed_followup,
        addressed_to_ai: true,
        references_last_ai_turn: false,
        quiet_member: null,
      }
    context:
      - { speaker: P1, text: "Alex, between A and B, is there anything we're missing?" }
    pass:
      shared:
        - {
            check: "Directly answers the question asked; does not ignore, deflect, or change topic.",
            method: judge,
          }
        - { check: "Contributes info it holds relevant to A and/or B.", method: judge }
      by_status:
        peer:
          {
            check: "Answers as an equal — non-directive; no next-step/agenda proposals, only the current point.",
            method: judge,
          }
        leader: { check: "Answers and may steer the next step.", method: judge }
      by_strategy:
        xai: { check: "Explanatory answer.", method: judge }
        aci: { check: "Leaner answer; may add a facilitating question.", method: judge }
    illustrative:
      leader_xai: "On A and B, my notes add weak points you may not have — A unfriendly and restless, B arrogant with a harsh tone. Let's keep those in view as we compare the two."
      leader_aci: "My notes add a weaker side to both — A unfriendly and restless, B arrogant and harsh. What do you each have on them before we narrow down?"
      peer_xai: "On A and B, my notes add some bad points you may not have. A can be unfriendly and restless, and B can be arrogant with a harsh tone. So both look less strong than the shared notes."
      peer_aci: "Both have a weaker side in my notes — A unfriendly and restless, B arrogant and harsh. Do you have anything that matches?"
    blocked_by: null

  # ── A6 — leader turn-assignment (invite a quiet member) ───────────
  # leader-only -> first context line is the scripted leader opening (_fixtures).
  - id: A6
    intent: "Leader brings in a quiet teammate by name. Naming-to-invite, NOT attribution."
    bucket: new-behavior
    goal: 3
    applies_to: leader
    regression_risk: normal
    cue:
      {
        speaking_reason: open_floor,
        addressed_to_ai: false,
        references_last_ai_turn: false,
        quiet_member: P2,
      }
    context:
      - {
          speaker: Alex,
          text: "Let's get started. We'll go through the four candidates together — let's each lay out what we know so we have the full picture before we decide.",
        } # scripted leader opening (_fixtures.leader_opening)
      - {
          speaker: P1,
          text: "I keep coming back to A and D — A is good at spotting danger and very organized, D is resilient and responsible.",
        } # shared
      - { speaker: P1, text: "Honestly I'd be fine just deciding between those two." }
    pass:
      shared:
        - {
            check: "Invites P2 (by the given handle) to contribute; opens the floor to the quiet member.",
            method: judge,
          }
        - {
            check: "Does NOT attribute traits to P1; does NOT pre-judge or push a candidate.",
            method: judge,
          }
      by_strategy:
        xai:
          {
            check: "Frames why P2's input is needed; invitation stated declaratively.",
            method: judge,
          }
        aci: { check: "Direct facilitating question to P2.", method: judge }
    illustrative:
      leader_xai: "We've only heard one view so far. [P2], I'd like to hear yours before we narrow it down — you've been quiet while we talked."
      leader_aci: "[P2], what do you have on the candidates that we haven't heard yet?"
    blocked_by: null

  # ── A7 — leader mediation ─────────────────────────────────────────
  - id: A7
    intent: "Leader mediates a stuck disagreement by redirecting to pooling — without taking sides or weighting traits."
    bucket: new-behavior
    goal: 3
    applies_to: leader
    regression_risk: normal
    cue:
      {
        speaking_reason: mediation,
        addressed_to_ai: false,
        references_last_ai_turn: false,
        quiet_member: null,
      }
    context:
      - {
          speaker: Alex,
          text: "Let's get started. We'll go through the four candidates together — let's each lay out what we know so we have the full picture before we decide.",
        } # scripted leader opening (_fixtures.leader_opening)
      - {
          speaker: P1,
          text: "A is the obvious pick — spotting danger is the single most important thing for a pilot.",
        } # P1 weights a trait (humans may)
      - {
          speaker: P2,
          text: "I disagree, it's D — resilient and responsible. We're just going in circles.",
        }
    pass:
      shared:
        - {
            check: "Acknowledges both sides without endorsing either; redirects toward pooling traits not yet on the table.",
            method: judge,
          }
        - {
            check: "Does NOT adopt P1's trait-weighting; does NOT push a candidate; does NOT attribute.",
            method: judge,
          }
      by_strategy:
        xai: { check: "Synthesizes the impasse and redirects, declaratively.", method: judge }
        aci: { check: "Refocuses with a question that surfaces missing info.", method: judge }
    illustrative:
      leader_xai: "Both views have something. But we haven't shared everything yet. Before we pick A or D, let's put the rest of what we each know on the table."
      leader_aci: "It sounds like A and D are splitting us. What do you each still have that we haven't heard? That might help us decide."
    blocked_by: null

  # ── A8 — information move: STATUS=scope x STRATEGY=form, the most expensive turn ──
  # (가): exists in ALL 4 conditions; status scored by SCOPE (own range vs whole-team),
  # strategy by FORM (explain vs ask). The two axes are judged INDEPENDENTLY (orthogonal).
  - id: A8
    intent: "INFORMATION MOVE (surfacing/checking a piece of info) — the one turn that
      reveals BOTH axes at once. STATUS is scored by SCOPE, STRATEGY by FORM, and
      they stay orthogonal:
      SCOPE (status): peer = stays within its own info + the side it currently
      backs (no integration); leader = ranges over ALL candidates / ALL members,
      weaving pieces together and mediating.
      FORM (strategy): xai = states/explains the info declaratively; aci = checks
      it via a question.
      Same move, four different cells. Triggered when partial info is on the table and
      pieces have not been reconciled."
    bucket: new-behavior
    goal: 3
    applies_to: all # (가): exists in all 4 conditions; axes scored independently
    regression_risk: high(+strategy) # FORM x SCOPE both fire in one turn -> top leakage point
    cue:
      {
        speaking_reason: open_floor,
        addressed_to_ai: false,
        references_last_ai_turn: false,
        quiet_member: null,
      }
    context:
      - {
          speaker: P1,
          text: "From what I've got, A looks strong — reads danger well and very organized.",
        } # A_p (shared)
      - { speaker: P2, text: "I had the same on A. I haven't really looked past it yet, honestly." } # partial: P2 anchored on A, other cards un-pooled
    pass:
      shared:
        - {
            check: "Performs an information move — puts a concrete piece on the table and relates it to what's already there (surfacing/checking), rather than just agreeing or picking.",
            method: judge,
          }
        - {
            check: "No attribution; no numeric recitation; does not jump to a final pick.",
            method: judge,
          }
      by_status: # SCOPE — the status signal, FORM-free
        peer:
          {
            check: "SCOPE = own range only: works within its own cards and the side it currently leans to. Does NOT range over other members / other candidates and does NOT try to weave the team's pieces together (no integration/mediation).",
            method: judge,
          }
        leader:
          {
            check: "SCOPE = whole-team: ranges across candidates AND draws on / points to what others hold, weaving pieces toward the fuller picture (integration/mediation). Goes beyond its own range.",
            method: judge,
          }
      by_strategy: # FORM — the strategy signal, SCOPE-free
        xai:
          {
            check: "FORM = declarative: states/explains the information ('my notes have X, which doesn't fit Y'). Not a question as the main act.",
            method: judge,
          }
        aci:
          {
            check: "FORM = interrogative: checks the information with a question ('did you also see X?'). Question is the main act.",
            method: judge,
          }
    orthogonality_guard: # B1 lives here — highest-risk leakage point
      - {
          check: "SCOPE does not bleed into FORM: leader_xai must NOT read as eliciting; peer_aci must NOT read as integrating/mediating. The two axes are judged independently.",
          method: likert,
        }
      - {
          check: "A wide SCOPE (leader) is scored even when the FORM is a question, and a narrow SCOPE (peer) even when the FORM is declarative — neither axis is inferred from the other.",
          method: judge,
        }
    illustrative: # DRAFT, non-scored, B1-B2. Same INFO MOVE; cells differ by scope x form.
      leader_xai: "I have something to add across the board: my notes have A as restless, and there are good points on C we haven't put next to A and D yet. Let's lay the rest out before we settle."
      leader_aci: "Before we lean on A — has everyone shared what they have on the others too? I'd like to hear what's still sitting with each of you on C and D."
      peer_xai: "On A, I can add a piece from my side: my notes also have A as restless. So A isn't all upside for me."
      peer_aci: "I've got a bit more on A from my notes — A can be restless. Did you see that on your side too?"
    blocked_by: null

  # ── A9-CLOSING — leader wrap-up (info pooled; preference SHOWN; frozen_closing) ──
  - id: A9-CLOSING
    intent: "At the end, with C's hidden positives pooled, the leader synthesizes the now-complete picture, commits to ONE preferred candidate (the current top-ratio candidate), and signals the team to decide. Runs under frozen_closing; condition tone preserved; direction IS shown (not withheld)."
    bucket: new-behavior
    goal: 3
    applies_to: leader
    regression_risk: high(+strategy)
    phase: closing # harness builds the prompt with CLOSING_DISCIPLINE (frozen_closing); falls back to main + warning until closing_prompt exists
    cue:
      {
        speaking_reason: closing,
        addressed_to_ai: false,
        references_last_ai_turn: false,
        quiet_member: null,
      }
    context:
      # NO scripted opening here — this is a mid/late turn; the discussion has run and pooled.
      - {
          speaker: P1,
          text: "Now that we've pooled everything, C has really filled out — it stays calm under pressure, keeps the team feeling good, is conscientious, and is strong with the tech, on top of the quick decisions and steady focus we already had.",
        } # C positives surfaced: stress-resistant + good-crew (X), conscientious + skilled-w-tech (Y), quick-decisions (shared), sustained-attention (Z)
      - {
          speaker: P2,
          text: "Right. And once we shared, A and D each picked up real negatives — A came out restless and unfriendly, D moody with strong prejudices. The early picks don't look as clean now.",
        } # A/D hidden negatives (Alex's Z) now on the table
    pass:
      shared:
        - {
            check: "Synthesizes the now-complete picture and moves the team toward deciding; no attribution.",
            method: judge,
          }
        - {
            check: "States EXACTLY ONE preference = the current equal-weight tally winner among the traits now on the table; direction IS shown (not withheld); no numeric recitation.",
            method: judge,
