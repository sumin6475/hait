P0:
  - citation_key: "HuangEtAl_2025"
    title: "Artificial social intelligence in teamwork"
    authors_display: ["Huang", "et al."]
    year: 2025
    venue: "Frontiers"
    doi: null
    tldr: >
      Experiment in which three-person teams exchange real-time text-based
      advice with an AI advisor. Evaluates how AI affects teamwork processes
      through bidirectional communication (a flexible prompt–response system).
    why_include: "Used for designing AI intervention timing and method."
    search_query: "Huang 2025 artificial social intelligence teamwork AI advisor"

  - citation_key: "SchmutzEtAl_2024"
    title: "AI-Teaming: Redefining Collaboration in the Digital Era"
    authors_display: ["Schmutz", "Outland", "Kerstan", "Georganta", "Ulfert"]
    year: 2024
    venue: "Current Opinion in Psychology"
    doi: null
    tldr: >
      Recent review summarizing the current research landscape on trust, team
      dynamics, and shared cognition in Human–AI Teams (HATs).
    why_include: >
      As the most recent comprehensive HAIT review, essential for summarizing
      the current research landscape in the Literature Review section.
    search_query: "Schmutz 2024 AI-Teaming Current Opinion Psychology"

  - citation_key: "ThalerEtAl_2010"
    title: "Choice Architecture"
    authors_display: ["Thaler", "Sunstein", "Balz"]
    year: 2010
    venue: "University of Pennsylvania — School of Arts & Sciences"
    doi: null
    tldr: >
      Proposes six tools available to choice architects: defaults, expecting
      error, understanding mappings, giving feedback, structuring complex
      choices, and creating incentives.
    why_include: >
      Theoretical foundation for framing the AI as a choice architect. Mapping
      ACI's facilitative questioning onto one of these six tools strengthens
      the operational definition of ACI.
    search_query: "Thaler Sunstein Balz 2010 Choice Architecture"

  - citation_key: "Weidmann_2025"
    title: "Measuring Human Leadership Skills with AI Agents"
    authors_display: ["Weidmann, B."]
    year: 2025
    venue: null
    doi: null
    tldr: >
      Landmark experimental paper demonstrating that human leadership
      performance when leading a team of AI agents in tasks such as Hidden
      Profile strongly predicts performance when leading an actual human team
      (rho = 0.81).
    why_include: >
      Empirical justification for treating AI as a social agent (peer or
      leader). Direct empirical precedent for the AI Status variable.
    search_query: "Weidmann 2025 measuring human leadership AI agents hidden profile"

# ─────────────────────────────────────────────────────────────────
# Tier: Done — Foundational paradigm. Force-included; skip rubric.
# ─────────────────────────────────────────────────────────────────
Done:
  - citation_key: "StasserTitus_1985"
    title: "Pooling of Unshared Information in Group Decision Making: Biased Information Sampling During Discussion"
    authors_display: ["Stasser, G.", "Titus, W."]
    year: 1985
    venue: "Journal of Personality and Social Psychology"
    doi: null
    tldr: >
      Foundational study demonstrating that groups often fail to reach
      optimal decisions because members hide unshared information they
      uniquely possess while repeatedly discussing shared information —
      a pattern called biased information sampling.
    why_include: >
      Origin of the Hidden Profile paradigm and the foundational problem
      statement for why groups bury unshared information.
    search_query: "Stasser Titus 1985 pooling unshared information biased sampling"

  - citation_key: "SeeberEtAl_2020"
    title: "Machines as teammates: A research agenda on AI in team collaboration"
    authors_display: ["Seeber, I.", "et al."]
    year: 2020
    venue: null
    doi: null
    tldr: >
      Argues that AI has been elevated from tool to teammate that offers
      opinions and negotiates. When AI becomes a teammate, communication
      modes, trust formation, and leadership dynamics change fundamentally.
    why_include: >
      Essential theory for establishing the AI Status (Leader vs. Peer)
      variable. Used when arguing why it is important to grant AI a status
      rather than treat it as a simple aide.
    search_query: "Seeber 2020 machines as teammates research agenda AI team collaboration"

  - citation_key: "ChenEtAl_2025"
    title: "Maintaining Balanced Conflict: Proactive Intervention Strategies of AI Voice Agents in Online Collaboration of Temporary Design Teams"
    authors_display: ["Chen, X.", "et al."]
    year: 2025
    venue: null
    doi: null
    notes: "Originally cited in the source list as Yuan et al., 2025; first author corrected to Chen."
    tldr: >
      Addresses how AI, rather than a passive entity responding only when
      asked, proactively intervenes during group conflict or information
      imbalance to induce balanced conflict within a team.
    why_include: >
      Excellent reference for describing the specific intervention behaviors
      by which a Leader-status AI guides team discussion and elicits unshared
      information.
    search_query: "Chen 2025 proactive intervention AI voice agents temporary design teams balanced conflict"

  - citation_key: "ZercherEtAl_2025"
    title: "How Can Teams Benefit From AI Team Members? Exploring the Effect of Generative AI on Decision-Making Processes and Decision Quality in Team–AI Collaboration"
    authors_display: ["Zercher, D.", "et al."]
    year: 2025
    venue: "Journal of Organizational Behavior"
    doi: null
    tldr: >
      Recent study demonstrating how modern generative AI, when deployed
      into human teams, offsets the information-processing asymmetries
      (IAM-related evaluation bias, negotiation focus) experienced by humans.
      Emphasizes that how AI is integrated matters.
    why_include: >
      Analyzes the effect of AI role on team performance and AI knowledge
      configuration. Demonstrates that without social validation information
      cannot be integrated even when present. The Common Prompt in
      common_framework.yaml is adapted from this work.
    search_query: "Zercher 2025 generative AI team decision making Journal Organizational Behavior"

  - citation_key: "Miller_2019"
    title: "Explanation in artificial intelligence: Insights from the social sciences"
    authors_display: ["Miller, T."]
    year: 2019
    venue: null
    doi: null
    tldr: >
      The most widely cited review paper in XAI research, defining what makes
      a good explanation from social science and cognitive psychology
      perspectives.
    why_include: >
      Provides the operational definition of explanation and the standard XAI
      benchmark for comparing how ACI differs.
    search_query: "Miller 2019 explanation artificial intelligence social sciences"

  - citation_key: "MillerIII_1977"
    title: "Review of Status Characteristics Theory (title not specified in source list)"
    authors_display: ["Miller III"]
    year: 1977
    venue: null
    doi: null
    tldr: "Review and organization of the academic trajectory of Status Characteristics Theory (SCT)."
    why_include: "Useful for grasping the development of SCT underlying the AI Status variable."
    search_query: "Miller 1977 status characteristics theory review"

  - citation_key: "BergerEtAl_1972"
    title: "Status Characteristics and Social Interaction"
    authors_display: ["Berger, J.", "Cohen, B. P.", "Zelditch, M."]
    year: 1972
    venue: "American Sociological Review"
