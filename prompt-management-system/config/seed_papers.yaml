# ─────────────────────────────────────────────────────────────────
# seed_papers.yaml — Literature seeds for Agent 0 (Scout)
# ─────────────────────────────────────────────────────────────────
# Per CLAUDE.md §7.1. Tier handling:
#   - P0   : force-include in validated_kb.md, skip rubric, source_tier "P0"
#   - Done : force-include in validated_kb.md, skip rubric, source_tier "Done"
#   - P1   : enter candidate pool as seeds; subject to 5-point rubric;
#            kept only if utility_score >= 4.0 (fallback 3.5)
#   - P2   : same handling as P1
#   - Reading : same handling as P1
#
# Sources (verbatim summaries):
#   - docs/source_materials/seed_papers_P0_P1_P2.md
#   - docs/source_materials/seed_papers_done_reading.md
#
# Citation keys follow the ValidatedPaper regex /^[A-Z][a-zA-Z]+(EtAl)?_\d{4}$/
# (CLAUDE.md §6.3). Where author names contain non-ASCII characters, the
# original spelling is recorded in `authors_display`; the citation_key uses
# an ASCII fallback. DOIs are filled by the Scout via OpenAlex; null here.
# ─────────────────────────────────────────────────────────────────

